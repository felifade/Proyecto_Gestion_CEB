<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Auditor de Expedientes{% endblock %}</title>
  <!-- Google Fonts: Outfit -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Estilos Personalizados Premium -->
  <link rel="stylesheet" href="/static/css/style.css">
  {% block styles %}{% endblock %}
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg sticky-top border-0">
    <div class="container">
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="/">
        <i class="bi bi-shield-check text-primary fs-3"></i>
        <span>Auditor de Expedientes</span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText" aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarText">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-3">
          <li class="nav-item">
            <a class="nav-link" href="/"><i class="bi bi-grid-1x2-fill me-1"></i> Dashboard</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/configuracion"><i class="bi bi-gear-fill me-1"></i> Configuración</a>
          </li>
        </ul>
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-outline-secondary border-0 p-2" id="theme-toggle-btn" title="Cambiar Tema">
            <i class="bi bi-moon-stars-fill text-dark" id="theme-icon"></i>
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Contenedor Principal -->
  <div class="container my-5">
    {% block content %}{% endblock %}
  </div>

  <!-- Bootstrap 5 Bundle with Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Archivo JS Personalizado -->
  <script src="/static/js/app.js"></script>
  <!-- Google API Client Libraries for Drive and Picker -->
  <script src="https://apis.google.com/js/api.js"></script>
  <script src="https://accounts.google.com/gsi/client"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
